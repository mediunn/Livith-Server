name: deploy

on:
  push:
    branches:
      - develop
      - main
      - legacy
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/legacy' && 'legacy' || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject unsupported manual deployment refs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/legacy'
        run: |
          echo "::error::Manual deployment is only allowed from develop, main, or legacy."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies on runner
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate Prisma Client on runner
        run: npm exec prisma generate

      - name: Build project on runner
        run: npm run build

      - name: Set deploy variables
        run: |
          echo "SENTRY_RELEASE=${GITHUB_SHA}" >> $GITHUB_ENV

          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            echo "TARGET=dev_livith_ec2" >> $GITHUB_ENV
            echo "APP_DIR=/opt/app" >> $GITHUB_ENV
            echo "SERVICE=app" >> $GITHUB_ENV
            echo "SENTRY_ENVIRONMENT=development" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/legacy" ]]; then
            echo "TARGET=livith_ec2" >> $GITHUB_ENV
            echo "APP_DIR=/opt/app-legacy" >> $GITHUB_ENV
            echo "SERVICE=app-legacy" >> $GITHUB_ENV
            echo "SENTRY_ENVIRONMENT=legacy" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "TARGET=livith_ec2" >> $GITHUB_ENV
            echo "APP_DIR=/opt/app" >> $GITHUB_ENV
            echo "SERVICE=app" >> $GITHUB_ENV
            echo "SENTRY_ENVIRONMENT=production" >> $GITHUB_ENV
          else
            echo "::error::Unsupported deployment ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Create Sentry release and upload source maps
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/legacy'
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: ${{ github.ref == 'refs/heads/develop' && 'development' || github.ref == 'refs/heads/legacy' && 'legacy' || 'production' }}
          release: ${{ github.sha }}
          sourcemaps: './dist'

      - name: Remove source maps before deploy
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/legacy'
        run: find dist -name '*.map' -delete

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
          cat <<EOF > ~/.ssh/config
          Host dev_livith_ec2
            HostName $DEV_EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          else
          cat <<EOF > ~/.ssh/config
          Host livith_ec2
            HostName $PROD_EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          fi
        env:
          EC2_USER: ubuntu
          DEV_EC2_HOST: ${{ secrets.DEV_EC2_HOST }}
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Verify server Node.js runtime
        run: |
          ssh ${{ env.TARGET }} 'bash -s' <<'EOF'
          NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)
          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "::error::Server Node.js 20 or higher is required. Upgrade the EC2 Node.js runtime before deploying."
            node --version || true
            exit 1
          fi
          node --version
          npm --version
          EOF

      - name: Copy Workspace
        run: |
          ssh ${{ env.TARGET }} "sudo mkdir -p ${{ env.APP_DIR }}"
          ssh ${{ env.TARGET }} "sudo chown ubuntu:ubuntu ${{ env.APP_DIR }}"
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.deploy-dependency-key' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='*firebase*.json' \
            --exclude='*service-account*.json' \
            --exclude='*.pem' \
            --exclude='coverage/' \
            --exclude='tmp/' \
            ./ ${{ env.TARGET }}:${{ env.APP_DIR }}

      - name: Install dependencies on server
        run: |
          ssh ${{ env.TARGET }} "cd ${{ env.APP_DIR }}; bash -s" <<'EOF'
          set -euo pipefail

          DEPENDENCY_KEY="$(sha256sum package.json package-lock.json | sha256sum | awk '{print $1}')-node$(node -p "process.versions.node.split('.')[0]")"

          if [ -d node_modules ] && [ -x node_modules/.bin/prisma ] && [ -f .deploy-dependency-key ] && [ "$(cat .deploy-dependency-key)" = "$DEPENDENCY_KEY" ]; then
            echo "Dependencies unchanged. Skipping npm ci."
            exit 0
          fi

          npm ci --prefer-offline --no-audit --no-fund
          echo "$DEPENDENCY_KEY" > .deploy-dependency-key
          EOF

      - name: Verify build output
        run: |
          ssh ${{ env.TARGET }} "test -f ${{ env.APP_DIR }}/dist/src/main.js" \
            || { echo '::error::빌드 산출물 dist/src/main.js 누락 — 재시작 중단 (기존 프로세스 유지)'; exit 1; }

      - name: Write deployment environment file
        run: |
          ssh ${{ env.TARGET }} "cat > ${{ env.APP_DIR }}/.deploy.env" << EOF
          SENTRY_RELEASE=${SENTRY_RELEASE}
          SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT}
          EOF

      - name: Apply prisma migrations
        run: |
          ssh ${{ env.TARGET }} "cd ${{ env.APP_DIR }}; npm exec prisma migrate deploy"

      - name: Copy systemd service file
        run: |
          APP_DIR="${{ env.APP_DIR }}"
          SERVICE="${{ env.SERVICE }}"
          ssh ${{ env.TARGET }} "sudo tee /etc/systemd/system/${SERVICE}.service" << EOF
          [Unit]
          Description=Livith Project
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=${APP_DIR}
          EnvironmentFile=-${APP_DIR}/.env
          EnvironmentFile=-${APP_DIR}/.deploy.env
          ExecStart=/usr/bin/npm run start:prod --prefix ${APP_DIR}/
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Enable systemd service
        run: |
          ssh ${{ env.TARGET }} 'sudo systemctl daemon-reload'
          ssh ${{ env.TARGET }} "sudo systemctl enable ${{ env.SERVICE }}"

      - name: Restart and verify systemd service
        run: |
          ssh ${{ env.TARGET }} "
            if ! sudo systemctl restart ${{ env.SERVICE }}; then
              sudo systemctl status ${{ env.SERVICE }} --no-pager || true
              sudo journalctl -u ${{ env.SERVICE }} -n 100 --no-pager || true
              exit 1
            fi

            for i in \$(seq 1 30); do
              if sudo systemctl is-active --quiet ${{ env.SERVICE }} && curl -fsS --max-time 2 http://127.0.0.1:3000/health > /dev/null; then
                echo 'Health check passed'
                exit 0
              fi
              sleep 2
            done

            sudo systemctl status ${{ env.SERVICE }} --no-pager || true
            sudo journalctl -u ${{ env.SERVICE }} -n 100 --no-pager || true
            exit 1
          "

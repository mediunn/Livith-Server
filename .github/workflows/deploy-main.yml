name: deploy

on:
  push:
    branches: [develop, main, legacy]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 브랜치별 배포 대상을 한 테이블에서 결정 (단일 소스)
      - name: Resolve deploy target
        run: |
          case "${GITHUB_REF_NAME}" in
            develop) TARGET=dev_livith_ec2; HOST='${{ secrets.DEV_EC2_HOST }}';  DIR=/opt/app;        SVC=app;        PORT=4000; ENVNAME=development ;;
            main)    TARGET=livith_ec2;     HOST='${{ secrets.PROD_EC2_HOST }}'; DIR=/opt/app;        SVC=app;        PORT=4000; ENVNAME=production ;;
            legacy)  TARGET=livith_ec2;     HOST='${{ secrets.PROD_EC2_HOST }}'; DIR=/opt/app-legacy; SVC=app-legacy; PORT=3000; ENVNAME=legacy ;;
            *) echo "::error::Unsupported deployment ref: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          {
            echo "TARGET=$TARGET"
            echo "EC2_HOST=$HOST"
            echo "APP_DIR=$DIR"
            echo "SERVICE=$SVC"
            echo "HEALTH_PORT=$PORT"
            echo "SENTRY_ENVIRONMENT=$ENVNAME"
            echo "SENTRY_RELEASE=$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # 무거운 작업은 전부 러너에서 수행한다. 서버는 파일을 받아 실행만 한다.
      - name: Build
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm exec prisma generate
          npm run build

      - name: Create Sentry release and upload source maps
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: ${{ env.SENTRY_ENVIRONMENT }}
          release: ${{ env.SENTRY_RELEASE }}
          sourcemaps: ./dist

      - name: Remove source maps before deploy
        run: find dist -name '*.map' -delete

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host ${{ env.TARGET }}
            HostName ${{ env.EC2_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 10m
          EOF

      # node_modules를 러너에서 빌드해 보내므로 메이저 버전이 정확히 일치해야 한다.
      # systemd 는 로그인 셸 PATH 를 쓰지 않으므로 node 절대경로를 확정해 유닛에 박는다.
      - name: Verify server Node.js runtime
        run: |
          ssh ${{ env.TARGET }} 'bash -s' > /tmp/nodeinfo <<'EOF'
          set -eu
          BIN=$(command -v node || true)
          if [ -z "$BIN" ]; then
            echo "node not found in the non-interactive PATH (nvm-only installs are not visible to systemd either)" >&2
            exit 1
          fi
          BIN=$(readlink -f "$BIN")
          echo "NODE_BIN=$BIN"
          echo "NODE_MAJOR=$("$BIN" -p "process.versions.node.split('.')[0]")"
          EOF
          cat /tmp/nodeinfo
          . /tmp/nodeinfo
          if [ "$NODE_MAJOR" != "22" ]; then
            echo "::error::Server Node.js must be 22 (found major: $NODE_MAJOR). node_modules is prebuilt on the runner with Node 22."
            exit 1
          fi
          echo "NODE_BIN=$NODE_BIN" >> "$GITHUB_ENV"

      # 필요한 것만 명시적으로 전송한다 (allow-list).
      # --exclude 로 지정된 경로는 --delete 대상에서도 제외되어 서버의 .env 가 보존된다.
      - name: Deploy files
        run: |
          ssh ${{ env.TARGET }} "sudo mkdir -p ${{ env.APP_DIR }} && sudo chown ubuntu:ubuntu ${{ env.APP_DIR }}"
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.deploy.env' \
            dist node_modules package.json package-lock.json prisma \
            ${{ env.TARGET }}:${{ env.APP_DIR }}/

      - name: Write deployment environment file
        run: |
          ssh ${{ env.TARGET }} "cat > ${{ env.APP_DIR }}/.deploy.env" <<'EOF'
          SENTRY_RELEASE=${{ env.SENTRY_RELEASE }}
          SENTRY_ENVIRONMENT=${{ env.SENTRY_ENVIRONMENT }}
          EOF

      - name: Apply prisma migrations
        run: |
          ssh ${{ env.TARGET }} "cd ${{ env.APP_DIR }} && ./node_modules/.bin/prisma migrate deploy"

      - name: Install and restart service
        run: |
          ssh ${{ env.TARGET }} "sudo tee /etc/systemd/system/${{ env.SERVICE }}.service > /dev/null" <<'EOF'
          [Unit]
          Description=Livith (${{ env.SERVICE }})
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=${{ env.APP_DIR }}
          EnvironmentFile=-${{ env.APP_DIR }}/.env
          EnvironmentFile=-${{ env.APP_DIR }}/.deploy.env
          ExecStart=${{ env.NODE_BIN }} dist/src/main
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          ssh ${{ env.TARGET }} 'bash -s' <<'EOF'
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl enable ${{ env.SERVICE }}
          sudo systemctl restart ${{ env.SERVICE }}
          EOF

      - name: Health check
        run: |
          ssh ${{ env.TARGET }} 'bash -s' <<'EOF'
          for i in $(seq 1 30); do
            if systemctl is-active --quiet ${{ env.SERVICE }} \
               && curl -fsS --max-time 2 http://127.0.0.1:${{ env.HEALTH_PORT }}/health > /dev/null; then
              echo 'Health check passed'
              exit 0
            fi
            sleep 2
          done
          echo "::error::Health check failed on port ${{ env.HEALTH_PORT }}"
          sudo systemctl status ${{ env.SERVICE }} --no-pager || true
          sudo journalctl -u ${{ env.SERVICE }} -n 100 --no-pager || true
          exit 1
          EOF
